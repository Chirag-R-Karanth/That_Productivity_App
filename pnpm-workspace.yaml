packages:
  - "apps/*"
  - "packages/*"

# pnpm 11: approve dependency build scripts (postinstall) that run during install.
allowBuilds:
  '@firebase/util': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: true
  tesseract.js: true
  # Ships a prebuilt napi binary for its resolver; without the postinstall the
  # eslint import resolver cannot resolve TypeScript paths.
  unrs-resolver: true